<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
</head>
<body>

  <!-- Formulario para realizar una cotización -->
  <!-- Compra de una PC / portatil -->
  <!-- Existen cambios obligatorios -->
  <!-- Generar un cuadro de dialogo con la confirmación-->
  <!-- Aplicar estilos css-->

  <body>
    
    <section class="section">
      <div class="container">
        <h2 class="title has-text-centered">Cotización</h2>
        <div class="columns is-centered">
          <div class="column is-half">
            <form class="box" action="" autocomplete="off" id="formulario">
              <div class="field">
                <label class="label" for="apellidos">Apellidos del cliente</label>
                <input
                  type="text"
                  class="input"
                  id="apellidos"
                  minlength="3"
                  required
                />
              </div>
              <div class="field">
                <label class="label" for="nombres">Nombres del cliente</label>
                <input
                  type="text"
                  class="input"
                  id="nombres"
                  minlength="3"
                  required
                />
              </div>

              <div class="field">
                <label class="label" for="producto">Producto Técnico</label>
                <input
                  type="text"
                  class="input"
                  id="producto"
                  minlength="3"
                  required
                />
              </div>

              

              <div class="field">
                <label class="label" for="telefono">Número de teléfono</label>
                <input
                  type="text"
                  class="input"                
                  id="telefono"
                  minlength="9"
                  required
                />
              </div>

              <div class="field">
                <label class="label" for="dni">DNI</label>
                <input
                  type="text"
                  class="input"                
                  id="dni"
                  minlength="8"
                  required
                />
              </div>

              <div class="field">
                <label class="label" for="precio">Precio Base (Sin IGV)</label>
                <input type="number" class="input" value="0" id="precio" placeholder="Ingrese el precio" min="0" step="0.01" required />
              </div>

              <div class="field">
                <label class="label" for="subtotal">Subtotal</label>
                <input
                  type="text"
                  class="input"
                  value="0.00"
                  id="subtotal"
                  readonly
                />
              </div>

              <div class="field">
                <label class="label" for="igv">IGV</label>
                <input
                  type="text"
                  class="input"
                  value="0.00"
                  id="igv"
                  readonly
                />
              </div>

              <div class="field">
                <label class="label" for="total">Total</label>
                <input
                  type="text"
                  class="input"
                  value="0.00"
                  id="total"
                  readonly
                />
              </div>


              <div>
                <button class="button" type="submit">Realizar cotización</button>
                <button class="button" type="reset">Reiniciar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script>
      const precio = document.getElementById("precio");
      const subtotal = document.getElementById("subtotal");
      const igv = document.getElementById("igv");
      const total = document.getElementById("total");
      const formulario = document.getElementById("formulario");

      precio.addEventListener("input", function(){
        const precioIngreso = parseFloat(precio.value) || 0;

        const subtotalCal = precioIngreso / 1.18;
        const calculoigv =  precioIngreso - subtotalCal;
        const totalCal = precioIngreso;

        subtotal.value = subtotalCal.toFixed(2);
        igv.value = calculoigv.toFixed(2);
        total.value = totalCal.toFixed(2);
      })

      formulario.addEventListener("submit", function(){
        event.preventDefault();

        if (confirm("¿Estas seguro de proceder con esta cotización?")){
          alert("!Cotización hecha de manera correcta!")
        }
      })

    </script>
  </body>

  
</body>
</html>
